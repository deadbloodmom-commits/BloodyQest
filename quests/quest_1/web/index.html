<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кровавый шёпот — Квест 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Шапка чата -->
        <div class="chat-header">
            <span class="status-dot"></span>
            <h2>Квест №1: Пробуждение</h2>
        </div>

        <!-- Окно сообщений -->
        <div id="chat-messages" class="chat-messages"></div>

        <!-- Блок для вариантов выбора -->
        <div id="choices-container" class="choices-container"></div>

        <!-- Блок для ввода собственного текста игроком -->
        <div id="input-container" class="input-container hidden">
            <input type="text" id="user-input-field" placeholder="Напишите свой ответ во тьму...">
            <button id="send-btn">Отправить</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
