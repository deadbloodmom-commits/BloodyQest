<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шёпот: Квест 1</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Шапка мини-приложения -->
        <header class="chat-header">
            <h2>† Квест №1: Пробуждение †</h2>
        </header>

        <!-- Область чата с сообщениями -->
        <div id="chat-messages" class="chat-messages">
            <!-- Сообщения будут добавляться динамически через JavaScript -->
        </div>

        <!-- Область вариантов выбора (кнопок для игрока) -->
        <div id="choices-container" class="choices-container">
            <!-- Кнопки выбора будут появляться здесь -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
